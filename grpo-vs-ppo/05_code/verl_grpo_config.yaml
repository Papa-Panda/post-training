# verl GRPO minimal config snippet
# ref: https://github.com/volcengine/verl
algorithm:
  name: grpo
  gamma: 1.0
  lam: 1.0               # not used without critic, kept for compat
  adv_estimator: grpo    # group relative
  kl_coef: 0.02           # beta
  cliprange: 0.2
  cliprange_high: 0.28   # DAPO extended upper
  loss_agg_mode: seq-mean-token   # Dr.GRPO uses token-mean without div by len

data:
  gen_batch_size: 128    # queries per rollout
  n_samples_per_prompt: 16  # G
  max_prompt_length: 1024
  max_response_length: 2048

rollout:
  engine: vllm
  tensor_model_parallel_size: 2
  temperature: 0.9
  top_p: 0.95
  n: 16                  # same as G

actor_rollout_ref:
  actor:
    optim: adamw
    lr: 1.0e-6
    ppo_epochs: 1
    entropy_coeff: 0
  rollout:
    log_prob_micro_batch_size: 4
  ref:
    log_prob_micro_batch_size: 4
  rollout_ref_sync: true

reward_model:
  enable: false          # rule-based -> use custom reward fn
  style: rule
  overlong_buffer: 512
  overlong_penalty_factor: 0.2
